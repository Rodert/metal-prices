name: Collect Metal Prices

on:
  # 定时任务：每小时执行一次
  schedule:
    - cron: '0 * * * *'  # 每小时的第0分钟执行
  
  # 允许手动触发
  workflow_dispatch:
    inputs:
      products:
        description: '要采集的产品代码（逗号分隔）'
        required: false
        default: 'Au99.99,Au99.95,Au100g,Ag99.99,Pt99.95'

jobs:
  collect:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run collector
        env:
          # 从GitHub Secrets中读取目标API地址
          TARGET_API_URL: ${{ secrets.TARGET_API_URL }}
          # 产品列表（可选，不设置则使用默认列表）
          PRODUCTS: ${{ github.event.inputs.products || 'Au99.99,Au99.95,Au100g,Ag99.99,Pt99.95' }}
        run: |
          python collector.py
      
      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collection-logs-${{ github.run_number }}
          path: |
            *.log
          retention-days: 7
